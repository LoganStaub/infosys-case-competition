<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYU Information Systems</title>
  <link rel="stylesheet" href="../../shared/styles/base.css">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page2.css">
</head>
<body>
  <header>
    <a href="../home/index.html" class="header-logo">
      BYU <span>Marriott School of Business</span> | Dept of Information Systems
    </a>
    <div class="header-actions">
      <a href="../home/index.html" class="back-btn">← Back to Home</a>
    </div>
  </header>
  <main>
    <div class="page-container">
      <div class="header-banner">
        <h1>Interview Preparation: <span>Start chatting</span> with your <span>personal interviewer!</span></h1>
      </div>
      <div class="chat-module">
        <div class="chat-window">
          <div class="chat-messages" id="chat-messages">
            <div class="message system">Hello! I am your AI interviewer. Ready to begin?</div>
          </div>
          <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Type your response here... (Press Enter to send)">
            <button id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Brigham Young University</p>
    <p><a href="https://marriott.byu.edu/directory/departmental/#dept-5" target="_blank">Contact IS Professors</a></p>
  </footer>
  <script src="../../shared/scripts/utils.js"></script>
  <script src="page2.js"></script>
</body>
</html>
